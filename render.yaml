services:
  - type: web
    name: autogo-frontend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: https://autogo-79vw.onrender.com/api/docs
        sync: false
    autoDeploy: true
